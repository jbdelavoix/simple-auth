# auth.example.com — simple-auth
# app.example.com  — gated app
#
# /session/* is proxied to auth so /session/start and /session/establish
# can set host-only cookies on app.example.com. auth_request calls GET /session/check
# (200 + Remote-*, 401 login, 403 groups). Forward URLs and groups are on the client.
#
# Both go straight to the local backend, which trusts 127.0.0.1 (OIDC_TRUSTED_PROXIES)
# and reads the protected URL from X-Forwarded-Proto/Host/Uri. Do not pass it in a
# query string built from $request_uri: nginx does not encode it.
#
# Env: OIDC_ISSUER and OIDC_FRONTEND_ORIGIN = https://auth.example.com
#      OIDC_ALLOWED_HOSTS=auth.example.com
#      OIDC_TRUSTED_PROXIES=127.0.0.1
#      OIDC_APP_ORIGINS=https://app.example.com
# Backends: 127.0.0.1:8000 (simple-auth), 127.0.0.1:3000 (app)

upstream simple_auth {
    server 127.0.0.1:8000;
}

upstream app_backend {
    server 127.0.0.1:3000;
}

server {
    listen 443 ssl http2;
    server_name auth.example.com;

    ssl_certificate     /etc/letsencrypt/live/auth.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.example.com/privkey.pem;

    location / {
        proxy_pass http://simple_auth;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

server {
    listen 443 ssl http2;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;

    # /session/* is served on this host, so the session cookie is bound to
    # app.example.com only (no Domain), never to *.example.com.
    location /session/ {
        proxy_pass http://simple_auth;
        proxy_set_header Host              $host;
        proxy_set_header Cookie            $http_cookie;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location = /_session_check {
        internal;
        proxy_pass http://simple_auth/session/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host              $host;
        proxy_set_header Cookie            $http_cookie;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Uri   $request_uri;
    }

    location / {
        auth_request /_session_check;
        auth_request_set $auth_user   $upstream_http_remote_user;
        auth_request_set $auth_email  $upstream_http_remote_email;
        auth_request_set $auth_name   $upstream_http_remote_name;
        auth_request_set $auth_groups $upstream_http_remote_groups;
        auth_request_set $auth_login  $upstream_http_location;
        error_page 401 403 = @session_login;

        proxy_pass http://app_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Remote-User       $auth_user;
        proxy_set_header Remote-Email      $auth_email;
        proxy_set_header Remote-Name       $auth_name;
        proxy_set_header Remote-Groups     $auth_groups;
    }

    location @session_login {
        return 302 $auth_login;
    }
}
