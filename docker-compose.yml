services:
  auth:
    build: .
    image: ${OIDC_IMAGE:-simple-auth:local}
    ports:
      - "8000:8000"
    # Match the owner of the ./data bind mount. Default is the usual first
    # Linux user. Override with the host uid: PUID=$(id -u) PGID=$(id -g)
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8000}
      OIDC_FRONTEND_ORIGIN: ${OIDC_FRONTEND_ORIGIN:-http://localhost:8000}
      OIDC_CONNECTOR: ${OIDC_CONNECTOR:-local}
      OIDC_DATA_DIR: /data
      OIDC_TRUSTED_PROXIES: ${OIDC_TRUSTED_PROXIES:-}
      OIDC_SECRET_KEY: ${OIDC_SECRET_KEY:-}
      OIDC_ADMIN_PASSWORD: ${OIDC_ADMIN_PASSWORD:-}
      OIDC_LOGIN_ACCOUNT_LIMIT: ${OIDC_LOGIN_ACCOUNT_LIMIT:-50}
      # LDAP (only used when OIDC_CONNECTOR=ldap)
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_USER_BASE: ${LDAP_USER_BASE:-}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-(uid={username})}
      LDAP_GROUP_BASE: ${LDAP_GROUP_BASE:-}
      LDAP_GROUP_FILTER: ${LDAP_GROUP_FILTER:-(objectClass=groupOfNames)}
      LDAP_ADMIN_GROUP: ${LDAP_ADMIN_GROUP:-admins}
      LDAP_GROUP_ALLOWLIST: ${LDAP_GROUP_ALLOWLIST:-}
      LDAP_STARTTLS: ${LDAP_STARTTLS:-0}
      LDAP_ALLOW_INSECURE: ${LDAP_ALLOW_INSECURE:-0}
      LDAP_CA_FILE: ${LDAP_CA_FILE:-}
      LDAP_USER_ENABLED_FILTER: ${LDAP_USER_ENABLED_FILTER:-}
      OIDC_AUDIT_MAX_BYTES: ${OIDC_AUDIT_MAX_BYTES:-10485760}
      OIDC_AUDIT_KEEP: ${OIDC_AUDIT_KEEP:-10}
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
